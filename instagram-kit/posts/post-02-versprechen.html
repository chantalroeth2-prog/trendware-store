<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; font-family:'Inter',system-ui,sans-serif; overflow:hidden; }
.slide { width:1080px; height:1080px; display:flex; flex-direction:column; justify-content:center; padding:80px 90px; background:#fef8f4; position:relative; }
.title { font-family:'Comfortaa',sans-serif; font-size:52px; font-weight:700; color:#3d3530; margin-bottom:60px; line-height:1.3; }
.feature { display:flex; align-items:center; gap:24px; margin-bottom:36px; }
.icon { width:64px; height:64px; background:rgba(200,127,90,0.12); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; color:#c87f5a; flex-shrink:0; }
.feature-text { font-size:26px; color:#3d3530; }
.feature-text strong { color:#c87f5a; font-weight:600; }
.footer { margin-top:50px; font-size:22px; color:rgba(61,53,48,0.45); text-align:center; }
.bottom-line { position:absolute; bottom:0; left:0; right:0; height:4px; background:linear-gradient(90deg,#c87f5a,#4a8a82,transparent); }
</style></head>
<body>
<div class="slide">
  <div class="title">Unser Versprechen<br>an dich</div>
  <div class="feature">
    <div class="icon">&#10003;</div>
    <div class="feature-text"><strong>Handverlesen</strong> — Jedes Produkt von uns getestet</div>
  </div>
  <div class="feature">
    <div class="icon">&#10148;</div>
    <div class="feature-text"><strong>Schneller Versand</strong> — Kostenlos ab 39 &euro;</div>
  </div>
  <div class="feature">
    <div class="icon">&#8634;</div>
    <div class="feature-text"><strong>30 Tage Rückgaberecht</strong> — Kein Risiko</div>
  </div>
  <div class="feature">
    <div class="icon">&#9829;</div>
    <div class="feature-text"><strong>Support mit Herz</strong> — Immer für dich da</div>
  </div>
  <div class="footer">@trendware &middot; trendware.store</div>
  <div class="bottom-line"></div>
</div>
</body></html>
