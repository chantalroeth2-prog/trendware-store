<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; font-family:'Inter',system-ui,sans-serif; overflow:hidden; }
.slide { width:1080px; height:1080px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:80px; position:relative; background:linear-gradient(135deg,#653a28 0%,#7d4830 40%,#152e2d 100%); }
.slide::before { content:''; position:absolute; top:0;left:0;right:0;bottom:0; background:radial-gradient(circle at 50% 50%,rgba(200,127,90,0.15) 0%,transparent 60%),radial-gradient(circle at 80% 80%,rgba(74,138,130,0.1) 0%,transparent 40%); }
.content { position:relative; z-index:1; }
.title { font-family:'Comfortaa',sans-serif; font-size:48px; font-weight:700; color:#fef8f4; line-height:1.35; margin-bottom:30px; }
.desc { font-size:26px; color:rgba(254,248,244,0.65); line-height:1.6; margin-bottom:50px; }
.btn { display:inline-block; background:#fef8f4; border-radius:50px; padding:28px 60px; }
.btn-text { font-family:'Comfortaa',sans-serif; font-size:32px; font-weight:700; color:#7d4830; }
.btn-arrow { font-size:32px; color:#c87f5a; margin-left:12px; }
.footer { margin-top:60px; font-size:20px; color:rgba(254,248,244,0.35); }
.bottom-line { position:absolute; bottom:0; left:0; right:0; height:4px; background:linear-gradient(90deg,#c87f5a,#4a8a82,transparent); z-index:2; }
</style></head>
<body>
<div class="slide">
  <div class="content">
    <div class="title">Bereit für Produkte,<br>die dein Leben<br>einfacher machen?</div>
    <div class="desc">Entdecke handverlesene Gadgets<br>für jeden Bereich deines Lebens.</div>
    <div class="btn"><span class="btn-text">Jetzt shoppen</span><span class="btn-arrow">&rarr;</span></div>
    <div class="footer">trendware.store &middot; @trendware</div>
  </div>
  <div class="bottom-line"></div>
</div>
</body></html>
